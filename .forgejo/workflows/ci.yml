# Internal CI on Forgejo (gs-bootstrap docs/forgejo-ci.md). Forgejo prefers .forgejo/workflows over
# .github/workflows, so this file is what runs there. It is the PRIMARY place for the checks that
# .github/workflows/ci.yml used to run on every push: GitHub's copy is now workflow_dispatch + pull_request only.
#
# Runner: one host-executor runner (labels ubuntu-latest, ubuntu-22.04, linux; no docker, no sudo, no apt).
# Jobs that need something the runner lacks are gated on a repository variable and say so, instead of failing:
#   - web needs the @modcommunity/shared package: secret PACKAGES_TOKEN and variable PACKAGES_ENABLED=true.
#   - shell needs the GTK/WebKit dev packages on the runner box; it probes pkg-config and skips with a warning
#     when they are absent (a root step: install the apt list from .github/workflows/ci.yml), and also needs
#     PACKAGES_ENABLED=true for the frontend bundle.
#   - tmc-cli needs secret TMC_CLI_TOKEN and variable TMC_CLI_ENABLED=true.
# Tags are never mirrored to Forgejo, and release.yml stays on GitHub.
# Everything `npm run check` runs, plus the tests and the one cross-check that
# proves the Windows-only half of `tmc-usvfs` still compiles.
#
# Deliberately NOT a copy of the release workflow's matrix. The point here is to
# fail a pull request that breaks a guard, and every guard worth failing over —
# the path jail, the address guard, the protocol parsers, the token lifecycle —
# lives in `tmc-core`, which needs no display stack. Building the bundle on
# three operating systems on every push would cost twenty minutes to re-prove
# something the release workflow proves when it matters.
name: ci

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

# A force-push while CI is running should cancel the run it superseded.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

# ONE Rust toolchain for CI and releases, pinned rather than `stable`.
#
# A new stable ships new clippy lints, and `-D warnings` turns each into an
# error — so an unpinned toolchain can fail a release tag on code that passed
# review the day before (1.98's `question_mark` did exactly that). Bumping is a
# one-line change here AND in the other workflow, made on a branch, so the new
# lints fail a pull request first rather than a tag.
env:
    RUST_TOOLCHAIN: '1.98'

jobs:
    web:
        name: web (tsc, eslint, vitest)
        # Needs the @modcommunity/shared package from GitHub Packages: set secret PACKAGES_TOKEN and variable
        # PACKAGES_ENABLED=true on the Forgejo repo to turn it on (docs/forgejo-ci.md in dot-bootstrap).
        if: ${{ vars.PACKAGES_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://npm.pkg.github.com
                  scope: '@modcommunity'

            # `@modcommunity/shared` lives in GitHub Packages. See the release
            # workflow for why PACKAGES_TOKEN is the fallback.
            - name: Install
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

            - run: npm run check:web

    core:
        name: tmc-core (clippy, tests)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  components: clippy, rustfmt

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            # `tmc-core` and `tmc-usvfs` need none of the GTK stack — that is
            # the entire point of the workspace split, and this job is what
            # keeps the claim honest.
            - name: Clippy
              working-directory: src-tauri
              run: cargo clippy -p tmc-core -p tmc-usvfs --all-targets -- -D warnings

            - name: Test
              working-directory: src-tauri
              run: cargo test -p tmc-core -p tmc-usvfs

            - name: Formatting
              working-directory: src-tauri
              run: cargo fmt --all -- --check

    # Advisories, licences and sources of the whole dependency tree. cargo-audit and cargo-deny read Cargo.lock
    # and the metadata and compile nothing. Config: src-tauri/.cargo/audit.toml and src-tauri/deny.toml.
    # The tools are installed once into the runner's persistent ~/.cargo/bin; `cargo install` is a few minutes
    # the first time only.
    supply-chain:
        name: cargo audit, cargo deny
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}

            - name: Install cargo-audit and cargo-deny
              run: |
                  command -v cargo-audit >/dev/null || cargo install --locked cargo-audit
                  command -v cargo-deny >/dev/null || cargo install --locked cargo-deny

            - name: Advisories
              working-directory: src-tauri
              run: cargo audit --deny warnings

            - name: Licences, bans, sources
              working-directory: src-tauri
              run: cargo deny check licenses bans sources

    # The Tauri crate: clippy and tests over the WHOLE workspace. Needs the GTK/WebKit dev packages on the runner.
    shell:
        name: gamespice-app (clippy, tests)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Probe for the GTK stack
              id: gtk
              run: |
                  if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 libsoup-3.0; then
                      echo "present=yes" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=no" >> "$GITHUB_OUTPUT"
                      echo "::warning::GTK/WebKit dev packages are not installed on this runner; gamespice-app clippy and tests were SKIPPED"
                  fi

            - uses: dtolnay/rust-toolchain@master
              if: steps.gtk.outputs.present == 'yes'
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  components: clippy

            - uses: Swatinem/rust-cache@v2
              if: steps.gtk.outputs.present == 'yes'
              with:
                  workspaces: src-tauri

            # `tauri-build` reads the frontend's dist directory, so the bundle has to exist before the crate checks.
            # The bundle needs @modcommunity/shared, hence the PACKAGES_ENABLED gate.
            - name: Frontend bundle, clippy, tests
              if: steps.gtk.outputs.present == 'yes' && vars.PACKAGES_ENABLED == 'true'
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
              run: |
                  npm ci
                  npm run build
                  npm run check:rust
                  npm run test:rust

    # The bundled `tmc`: build it from the pinned ref and start it through the Console's own lookup.
    tmc-cli:
        name: bundled tmc (build, --version through the Console)
        if: ${{ vars.TMC_CLI_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Build and test
              env:
                  TMC_CLI_TOKEN: ${{ secrets.TMC_CLI_TOKEN }}
              run: bash scripts/build-tmc-cli.sh --test

    # INFORMATIONAL. The release workflow's `manifests` job runs `manifests:check --release`, which fails by design
    # until the owner's real exec key exists and the loader manifests are re-signed (docs/loader-manifests.md,
    # "What blocks a release"). Running it here on every push means a tag never finds out first. The gate itself is
    # not weakened: the ordinary check must pass, and the --release result is reported, not enforced, so the run
    # stays green while the gate is closed (ci-red reads green/red).
    manifests:
        name: manifests (check; release gate reported)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # The checker needs only ajv, not the whole tree: a full `npm ci` would need the private
            # @modcommunity/shared package, and this job must run without any secret. ajv is installed in a
            # scratch directory (inside the repo npm would resolve package.json's private scope) and linked in.
            - name: Install ajv (version from package.json)
              run: |
                  v=$(node -p "require('./package.json').devDependencies.ajv || require('./package.json').dependencies.ajv")
                  d=$(mktemp -d)
                  (cd "$d" && npm init -y >/dev/null && npm install --ignore-scripts "ajv@$v")
                  ln -s "$d/node_modules" node_modules

            - name: manifests:check (enforced)
              run: node scripts/manifests/check.ts

            - name: manifests:check --release (informational)
              run: |
                  rc=0
                  node scripts/manifests/check.ts --release > release-gate.log 2>&1 || rc=$?
                  cat release-gate.log
                  if [ "$rc" -eq 0 ]; then
                      echo "RELEASE GATE: OPEN (a tag would pass the manifests job)"
                  else
                      echo "RELEASE GATE: CLOSED - $(tail -1 release-gate.log). Owner-only blockers: docs/loader-manifests.md, 'What blocks a release'."
                  fi

    windows-crosscheck:
        # The Windows-only halves of `tmc-usvfs` — the IAT patch and the
        # injector — are never RUN in CI and cannot be. Type-checking them
        # against the Windows target is what catches the class of mistake that
        # would otherwise be found by reading, and it has already caught four.
        name: tmc-usvfs against x86_64-pc-windows-gnu
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  targets: x86_64-pc-windows-gnu

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Check
              working-directory: src-tauri
              run: cargo check -p tmc-usvfs --target x86_64-pc-windows-gnu
